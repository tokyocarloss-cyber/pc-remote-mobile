name: Build Windows Companion
on:
  push:
    branches: [full-redesign]
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: windows/requirements.txt
      - name: Install build dependencies
        timeout-minutes: 5
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary -r requirements.txt
          python -m pip install --disable-pip-version-check --prefer-binary pyinstaller
          python -c "import pystray, PIL, tkinterdnd2, mss; print('Runtime dependencies OK')"
      - name: Validate Python sources
        run: python -m py_compile pc_remote_server.py drop_edge.py companion.py
      - name: Validate tray menu
        run: python -c "import companion; companion.make_menu(); print('Tray menu OK')"
      - name: Build PC Remote EXE
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "NEXUS PC Remote"
          --collect-all tkinterdnd2
          --collect-all pystray
          --collect-all PIL
          --collect-all mss
          --hidden-import pystray._win32
          --hidden-import pystray._base
          companion.py
      - name: Verify bundled runtime
        shell: powershell
        run: |
          python -m PyInstaller.utils.cliutils.archive_viewer "dist\NEXUS PC Remote.exe" -l | Out-File -Encoding utf8 archive.txt
          if (-not (Select-String -Path archive.txt -Pattern "pystray" -Quiet)) { throw "pystray was not bundled into the EXE" }
          if (-not (Select-String -Path archive.txt -Pattern "PIL" -Quiet)) { throw "Pillow was not bundled into the EXE" }
          if (-not (Select-String -Path archive.txt -Pattern "tkinterdnd2" -Quiet)) { throw "tkinterdnd2 was not bundled into the EXE" }
          if (-not (Select-String -Path archive.txt -Pattern "mss" -Quiet)) { throw "MSS was not bundled into the EXE" }
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-PC-Remote-Windows
          path: windows/dist/NEXUS PC Remote.exe
