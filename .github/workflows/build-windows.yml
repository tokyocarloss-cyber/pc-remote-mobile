name: Build Windows Companion
on:
  push:
    branches: [full-redesign]
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: windows/requirements.txt
      - name: Install build dependencies
        timeout-minutes: 5
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary --timeout 30 --retries 2 -r requirements.txt
          python -m pip install --disable-pip-version-check --prefer-binary --timeout 30 --retries 2 pyinstaller
      - name: Validate Python sources
        run: python -m py_compile pc_remote_server.py drop_edge.py companion.py
      - name: Build PC Remote EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "PC Remote" --collect-all tkinterdnd2 --collect-all vgamepad companion.py
      - uses: actions/upload-artifact@v4
        with:
          name: PC-Remote-Windows
          path: windows/dist/PC Remote.exe
