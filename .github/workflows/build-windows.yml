name: Build Windows Companion
on:
  push:
    branches: [full-redesign]
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m py_compile pc_remote_server.py drop_edge.py companion.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "PC Remote" --collect-all tkinterdnd2 companion.py
      - uses: actions/upload-artifact@v4
        with:
          name: PC-Remote-Windows
          path: windows/dist/PC Remote.exe
