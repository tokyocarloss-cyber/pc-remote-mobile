name: Build Android APK

on:
  push:
    branches: [ main, full-redesign, 'nexus-v2-stability-sound-*', 'nexus-2-*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXUS_KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
      NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
      NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
      NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build test APK
        run: gradle testDebugUnitTest lintDebug assembleDebug

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Android-validation
          path: app/build/reports/
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-PC-Remote-Android-TEST
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare private release keystore
        if: env.NEXUS_KEYSTORE_BASE64 != '' && env.NEXUS_KEYSTORE_PASSWORD != '' && env.NEXUS_KEY_ALIAS != '' && env.NEXUS_KEY_PASSWORD != ''
        shell: bash
        run: |
          printf '%s' "$NEXUS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexus-release.jks"
          echo "NEXUS_KEYSTORE_PATH=$RUNNER_TEMP/nexus-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.NEXUS_KEYSTORE_BASE64 != '' && env.NEXUS_KEYSTORE_PASSWORD != '' && env.NEXUS_KEY_ALIAS != '' && env.NEXUS_KEY_PASSWORD != ''
        run: gradle assembleRelease

      - name: Upload signed release APK
        if: env.NEXUS_KEYSTORE_BASE64 != '' && env.NEXUS_KEYSTORE_PASSWORD != '' && env.NEXUS_KEY_ALIAS != '' && env.NEXUS_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-PC-Remote-Android-RELEASE
          path: app/build/outputs/apk/release/app-release.apk

  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NEXUS-PC-Remote-Android-TEST
          path: apk
      - run: cp apk/app-debug.apk app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python tools/android_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXUS-Android-smoke
          path: android-smoke/
