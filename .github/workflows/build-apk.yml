name: NEXUS 2.0 - tests and builds

on:
  push:
    branches: [main, "nexus-mega-update-*"]
  pull_request:
  workflow_dispatch:

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run server unit tests
        run: python -m unittest discover -s windows/tests -v

  build-android:
    runs-on: ubuntu-latest
    needs: test-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-PC-Remote-Android-2.0
          path: app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    runs-on: windows-latest
    needs: test-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pillow pyinstaller
      - name: Build Windows companion
        run: pyinstaller --clean --noconfirm --onefile --windowed --name NEXUS-PC-Remote --paths windows windows/nexus_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-PC-Remote-Windows-2.0
          path: dist/NEXUS-PC-Remote.exe
